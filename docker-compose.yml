# Dois modos:
#
# Desenvolvimento (a app corre com `npm start`, fora do Docker):
#   docker compose up -d                  → só PostgreSQL e Redis
#
# Aplicação completa em contentores (como em produção):
#   docker compose --profile app up -d --build
#   → http://localhost:8080
#   Precisa de JWT_ACCESS_SECRET no .env (ver README, "Correr tudo com Docker");
#   sem ele, o auth-service e o gateway recusam arrancar.
#
#   docker compose --profile app down     → pára (os dados ficam nos volumes)
#   docker compose --profile app down -v  → pára e apaga os dados

# Configuração comum aos quatro serviços NestJS.
x-node-service: &node-service
  profiles: [app]
  restart: unless-stopped
  init: true
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 20s

services:
  db:
    image: postgres:16-alpine
    container_name: devstart-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: devstart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devstart}
      POSTGRES_DB: postgres
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - devstart-db-data:/var/lib/postgresql/data
      - ./tools/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devstart']
      interval: 5s
      timeout: 3s
      retries: 10

  # Eventos entre serviços (Redis Streams) e contadores do rate limiting.
  # AOF ligado: os eventos ainda por consumir sobrevivem a um reinício do Redis.
  redis:
    image: redis:7-alpine
    container_name: devstart-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - devstart-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Aplicação (perfil "app") ──────────────────────────────────────────────
  # Só o nginx (web) tem porta publicada. Os serviços e o gateway ficam na rede
  # interna do compose: do exterior só se chega à API através do nginx.

  auth-service:
    <<: *node-service
    image: devstart/auth-service
    build:
      context: .
      target: node-service
      args: { SERVICE: auth-service }
    environment:
      NODE_ENV: production
      AUTH_SERVICE_PORT: 3001
      AUTH_DATABASE_URL: postgres://devstart:${POSTGRES_PASSWORD:-devstart}@db:5432/devstart_auth
      # Sem valor: vem do .env ou da shell. Se faltar, o serviço recusa arrancar
      # ("Define JWT_ACCESS_SECRET em produção.") em vez de usar o segredo de desenvolvimento.
      JWT_ACCESS_SECRET:
      REDIS_URL: redis://redis:6379
      # nginx + gateway à frente: o IP real do cliente está 2 entradas antes do fim.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}
    healthcheck:
      <<: *healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]

  profile-service:
    <<: *node-service
    image: devstart/profile-service
    build:
      context: .
      target: node-service
      args: { SERVICE: profile-service }
    environment:
      NODE_ENV: production
      PROFILE_SERVICE_PORT: 3002
      PROFILE_DATABASE_URL: postgres://devstart:${POSTGRES_PASSWORD:-devstart}@db:5432/devstart_profile
      REDIS_URL: redis://redis:6379
      # Ollama a correr no computador (fora do Docker), para ler CVs.
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_MODEL: ${XAI_MODEL:-grok-4-fast-non-reasoning}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      <<: *healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]

  tracker-service:
    <<: *node-service
    image: devstart/tracker-service
    build:
      context: .
      target: node-service
      args: { SERVICE: tracker-service }
    environment:
      NODE_ENV: production
      TRACKER_SERVICE_PORT: 3003
      TRACKER_DATABASE_URL: postgres://devstart:${POSTGRES_PASSWORD:-devstart}@db:5432/devstart_tracker
      REDIS_URL: redis://redis:6379
    healthcheck:
      <<: *healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3003/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]

  api-gateway:
    <<: *node-service
    image: devstart/api-gateway
    build:
      context: .
      target: node-service
      args: { SERVICE: api-gateway }
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      profile-service:
        condition: service_healthy
      tracker-service:
        condition: service_healthy
    environment:
      NODE_ENV: production
      GATEWAY_PORT: 3000
      WEB_ORIGIN: ${PUBLIC_URL:-http://localhost:8080}
      # Sem valor: vem do .env ou da shell. Se faltar, o serviço recusa arrancar
      # ("Define JWT_ACCESS_SECRET em produção.") em vez de usar o segredo de desenvolvimento.
      JWT_ACCESS_SECRET:
      AUTH_SERVICE_URL: http://auth-service:3001
      PROFILE_SERVICE_URL: http://profile-service:3002
      TRACKER_SERVICE_URL: http://tracker-service:3003
      REDIS_URL: redis://redis:6379
    healthcheck:
      <<: *healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]

  web:
    profiles: [app]
    image: devstart/web
    restart: unless-stopped
    build:
      context: .
      target: web
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-8080}:80'

volumes:
  devstart-db-data:
  devstart-redis-data:
