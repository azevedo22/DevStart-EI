# Frontend (Angular) + reverse proxy para a API, na mesma origem.
#
#   /api/...  → api-gateway (o browser nunca fala diretamente com os serviços)
#   /...      → ficheiros estáticos; rotas desconhecidas devolvem index.html (SPA)

upstream api_gateway {
    server api-gateway:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Acrescenta o IP de quem ligou ao nginx. O auth-service conta os saltos a
        # partir da direita (TRUST_PROXY_HOPS), por isso um X-Forwarded-For forjado
        # pelo cliente não muda o IP usado no rate limiting.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Ficheiros com hash no nome (main-ABC123.js): podem ficar em cache para sempre.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # index.html nunca em cache: depois de um deploy o browser vai buscar a versão nova.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
