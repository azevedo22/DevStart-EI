# Frontend (Angular) + reverse proxy para a API, na mesma origem.
#
#   /api/...  → api-gateway (o browser nunca fala diretamente com os serviços)
#   /...      → ficheiros estáticos; rotas desconhecidas devolvem index.html (SPA)

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;

    # DNS interno do Docker. Com o nome numa variável, o nginx volta a resolvê-lo
    # (no máximo a cada 10 s) em vez de fixar o IP no arranque: quando o gateway é
    # recriado num deploy e muda de IP, o nginx não fica a enviar para o antigo (502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_gateway http://api-gateway:3000;
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Importação do CV: ficheiros até 5 MB e uma IA local que pode levar minutos.
    location /api/v1/profile/cv/ {
        client_max_body_size 6m;
        proxy_pass $api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Foto de perfil: o browser reduz para 512×512, mas deixa-se folga ao multipart.
    location /api/v1/profile/photo {
        client_max_body_size 2m;
        proxy_pass $api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Análise de anúncios com IA: com um modelo local, pode passar de um minuto.
    location /api/v1/jobs/ {
        proxy_pass $api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /api/ {
        # Sem URI no proxy_pass: o caminho segue tal como veio (/api/v1/...).
        proxy_pass $api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Acrescenta o IP de quem ligou ao nginx. O auth-service conta os saltos a
        # partir da direita (TRUST_PROXY_HOPS), por isso um X-Forwarded-For forjado
        # pelo cliente não muda o IP usado no rate limiting.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Ficheiros com hash no nome (main-ABC123.js): podem ficar em cache para sempre.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # index.html nunca em cache: depois de um deploy o browser vai buscar a versão nova.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
