# Incluído em cada location: no nginx, um add_header dentro de um location
# anula TODOS os add_header herdados do server, por isso não se definem lá.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# 'unsafe-inline' só nos estilos (o Angular e o ng-bootstrap usam estilos inline).
# Scripts, pedidos e fontes só da própria origem. Por isso o build do Angular tem
# "inlineCritical": false (apps/web/project.json): esse passo injeta um <script> inline.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
