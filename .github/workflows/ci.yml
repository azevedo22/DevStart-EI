name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # PostgreSQL para os testes e2e (partilhado pelos serviços).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devstart
          POSTGRES_PASSWORD: devstart
          POSTGRES_DB: devstart_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devstart"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Redis para os testes do barramento de eventos e do outbox.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://devstart:devstart@localhost:5432/devstart_test
      TEST_REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Em PRs só corre o que foi afetado pela alteração; no main corre tudo.
      - uses: nrwl/nx-set-shas@v4

      - name: Testes (unitários + e2e)
        run: npx nx affected -t test --base=$NX_BASE --head=$NX_HEAD

      - name: Build
        run: npx nx affected -t build --base=$NX_BASE --head=$NX_HEAD

  # Constrói as 5 imagens, arranca a aplicação inteira em contentores e testa-a
  # através do nginx, como um browser. Apanha o que os testes unitários não veem:
  # dependências em falta na imagem, configuração do nginx, proxies, healthchecks.
  docker:
    runs-on: ubuntu-latest
    env:
      # Só para este job; nunca usado fora da CI.
      JWT_ACCESS_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v5

      - name: Build das imagens
        run: docker compose --profile app build

      - name: Arrancar a aplicação
        run: docker compose --profile app up -d --wait --wait-timeout 180

      - name: Smoke test (nginx → gateway → serviços)
        run: tools/smoke-test.sh http://localhost:8080

      - name: Logs em caso de falha
        if: failure()
        run: docker compose --profile app logs --no-color

      - name: Parar
        if: always()
        run: docker compose --profile app down -v
